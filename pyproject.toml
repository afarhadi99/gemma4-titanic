[project]
name = "gemma4-titanic"
version = "0.1.0"
description = "Kaggle Titanic: classical baseline plus Gemma 4 LoRA fine-tuned on Modal"
requires-python = ">=3.11"
dependencies = [
    "modal>=1.6.4",
    "kaggle>=2.2.5",
    "six>=1.17.0",
    "pandas>=3.1.1",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.1",
    "pytest>=9.2.0",
    "catboost>=1.2.10",
    "tabpfn>=10.2.0",
    "xgboost>=3.4.1",
    "lightgbm>=4.7.0",
    "tabicl>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titanic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
